<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long-run relative frequency demo</title>
<style>
:root {
  color-scheme: dark;
  --blue: #4d9bff;
  --red: #ff5f7e;
  --ink: #e8ecf2;
  --muted: #95a1b2;
  --line: #2b3440;
  --bg: #0f151c;
  --panel: #18202a;
}
html { background: var(--bg); }
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 20px;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.wrap { max-width: 920px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
button {
  font: inherit; font-weight: 600; cursor: pointer;
  padding: 10px 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
button:hover { background: #222c38; border-color: #3a4757; }
button:active { transform: translateY(1px); }
button.primary { background: var(--ink); border-color: var(--ink); color: #0f151c; }
button.primary:hover { background: #ffffff; border-color: #ffffff; }
.spacer { flex: 1 1 auto; min-width: 8px; }

.grid { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 18px; align-items: start; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.panel + .panel { margin-top: 14px; }
.panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 10px; }

.cards { display: flex; gap: 8px; flex-wrap: wrap; min-height: 96px; align-items: center; }
.card { width: 46px; height: 66px; border-radius: 6px; border: 1px solid rgba(255,255,255,.16); box-shadow: 0 1px 3px rgba(0,0,0,.45); }
.card.blue { background: var(--blue); }
.card.red { background: var(--red); }
.nocards { color: var(--muted); font-size: 14px; font-style: italic; }

.dots { flex: 1 1 100%; display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.dot { aspect-ratio: 1 / 1; border-radius: 50%; }
.dot.blue { background: var(--blue); }
.dot.red { background: var(--red); }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: none; font-weight: 700; }
.swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
.rf { font-size: 18px; font-weight: 700; }

/* deck panel */
.deck { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.deck .total { font-size: 15px; color: var(--muted); }
.deck .total b { font-size: 26px; color: var(--ink); font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }
.mix { display: flex; gap: 18px; }
.mix .item { display: flex; align-items: center; gap: 8px; }
.mix .chip { width: 18px; height: 26px; border-radius: 4px; border: 1px solid rgba(255,255,255,.16); }
.mix .chip.blue { background: var(--blue); }
.mix .chip.red { background: var(--red); }
.mix .num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.mix .lbl { font-size: 13px; color: var(--muted); }
.mix .num.hidden { color: var(--muted); }

.chartwrap { position: relative; height: 340px; }
canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="wrap">

<h1>How many cards in this deck are blue?</h1>
<p class="sub">Every card drawn is put back and the deck is reshuffled.</p>

<div class="controls">
  <button class="primary" id="d1">Draw 1 card</button>
  <button class="primary" id="d5">Draw 5 cards</button>
  <button class="primary" id="d100">Draw 100 cards</button>
  <div class="spacer"></div>
  <button id="reset">Start over</button>
  <button id="newdeck">New deck</button>
  <button id="reveal">Reveal the deck</button>
</div>

<div class="grid">
  <div>
    <div class="panel">
      <h2 id="lastLabel">Last draw</h2>
      <div class="cards" id="cards"><span class="nocards">No cards drawn yet.</span></div>
    </div>

    <div class="panel">
      <h2>Results so far</h2>
      <table>
        <thead>
          <tr><th>Outcome</th><th>Count</th><th>Relative frequency</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="swatch" style="background:var(--blue)"></span>Blue</td>
            <td id="cB">0</td><td class="rf" id="fB" style="color:var(--blue)">&mdash;</td>
          </tr>
          <tr>
            <td><span class="swatch" style="background:var(--red)"></span>Red</td>
            <td id="cR">0</td><td class="rf" id="fR" style="color:var(--red)">&mdash;</td>
          </tr>
          <tr><td>Total</td><td id="cT">0</td><td id="fT">&mdash;</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div>
    <div class="panel">
      <h2>The deck</h2>
      <div class="deck">
        <div class="total"><b>100</b>cards</div>
        <div class="mix">
          <div class="item">
            <div class="chip blue"></div>
            <div><div class="num hidden" id="mixB">?</div><div class="lbl">blue</div></div>
          </div>
          <div class="item">
            <div class="chip red"></div>
            <div><div class="num hidden" id="mixR">?</div><div class="lbl">red</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Relative frequency as cards accumulate</h2>
      <div class="chartwrap"><canvas id="chart"></canvas></div>
    </div>
  </div>
</div>

</div><!-- /.wrap -->

<script>
(function () {
  "use strict";

  var BLUE = "#4d9bff", RED = "#ff5f7e", MUTED = "#95a1b2", LINE = "#2b3440";

  var deckBlue = 37;          // hidden number of blue cards out of 100
  var revealed = false;
  var nBlue = 0, nRed = 0;
  var series = [];            // relative frequency of blue after each draw

  var $ = function (id) { return document.getElementById(id); };

  function drawOne() { return (Math.random() * 100) < deckBlue ? "blue" : "red"; }

  function doDraws(n, mode) {
    var shown = [];
    for (var i = 0; i < n; i++) {
      var c = drawOne();
      if (c === "blue") nBlue++; else nRed++;
      series.push(nBlue / (nBlue + nRed));
      shown.push(c);
    }
    renderDrawn(shown, n, mode);
    render();
  }

  function renderDrawn(shown, n, mode) {
    var box = $("cards");
    box.innerHTML = "";
    $("lastLabel").textContent = n === 1 ? "Last draw" : "Last " + n + " draws";

    if (mode === "dots") {
      var grid = document.createElement("div");
      grid.className = "dots";
      grid.setAttribute("role", "img");
      grid.setAttribute("aria-label", n + " cards drawn, shown as dots in the order they came out");
      for (var j = 0; j < shown.length; j++) {
        var dot = document.createElement("div");
        dot.className = "dot " + shown[j];
        grid.appendChild(dot);
      }
      box.appendChild(grid);
      return;
    }

    for (var i = 0; i < shown.length; i++) {
      var d = document.createElement("div");
      d.className = "card " + shown[i];
      d.setAttribute("role", "img");
      d.setAttribute("aria-label", shown[i] + " card");
      box.appendChild(d);
    }
  }

  function clearCards(msg) {
    $("cards").innerHTML = "";
    var p = document.createElement("span");
    p.className = "nocards";
    p.textContent = msg;
    $("cards").appendChild(p);
    $("lastLabel").textContent = "Last draw";
  }

  function render() {
    var total = nBlue + nRed;
    $("cB").textContent = nBlue;
    $("cR").textContent = nRed;
    $("cT").textContent = total;
    $("fB").textContent = total ? (nBlue / total).toFixed(3) : "—";
    $("fR").textContent = total ? (nRed / total).toFixed(3) : "—";
    $("fT").textContent = total ? "1.000" : "—";

    var mb = $("mixB"), mr = $("mixR");
    mb.textContent = revealed ? String(deckBlue) : "?";
    mr.textContent = revealed ? String(100 - deckBlue) : "?";
    mb.className = "num" + (revealed ? "" : " hidden");
    mr.className = "num" + (revealed ? "" : " hidden");
    $("reveal").textContent = revealed ? "Hide the deck" : "Reveal the deck";

    paint();
  }

  // ---- chart --------------------------------------------------------------

  function paint() {
    var cv = $("chart");
    var dpr = window.devicePixelRatio || 1;
    var r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    var ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, r.width, r.height);

    var W = r.width, H = r.height;
    var L = 46, R = 12, T = 12, B = 34;
    var pw = W - L - R, ph = H - T - B;
    if (pw <= 0 || ph <= 0) return;

    var n = series.length;
    var xmax = Math.max(n, 20);

    function X(i) { return L + (i / xmax) * pw; }
    function Y(v) { return T + (1 - v) * ph; }

    ctx.font = "12px -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif";
    ctx.textBaseline = "middle";

    var ticks = [0, 0.25, 0.5, 0.75, 1];
    ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.fillStyle = MUTED; ctx.textAlign = "right";
    for (var t = 0; t < ticks.length; t++) {
      var y = Math.round(Y(ticks[t])) + 0.5;
      ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
      ctx.fillText(ticks[t].toFixed(2), L - 8, Y(ticks[t]));
    }

    ctx.textAlign = "center";
    var steps = [0, 0.25, 0.5, 0.75, 1];
    for (var k = 0; k < steps.length; k++) {
      ctx.fillText(String(Math.round(xmax * steps[k])), L + steps[k] * pw, H - B + 14);
    }
    ctx.fillText("Cards drawn", L + pw / 2, H - B + 28);

    ctx.strokeStyle = "#54627a";
    ctx.beginPath();
    ctx.moveTo(L + 0.5, T); ctx.lineTo(L + 0.5, T + ph); ctx.lineTo(L + pw, T + ph);
    ctx.stroke();

    if (revealed) {
      var p = deckBlue / 100;
      ctx.save();
      ctx.setLineDash([6, 5]); ctx.lineWidth = 1.5; ctx.globalAlpha = 0.55;
      ctx.strokeStyle = BLUE;
      ctx.beginPath(); ctx.moveTo(L, Y(p)); ctx.lineTo(L + pw, Y(p)); ctx.stroke();
      ctx.strokeStyle = RED;
      ctx.beginPath(); ctx.moveTo(L, Y(1 - p)); ctx.lineTo(L + pw, Y(1 - p)); ctx.stroke();
      ctx.restore();
    }

    if (n === 0) {
      ctx.fillStyle = MUTED; ctx.textAlign = "center";
      ctx.fillText("Draw some cards to start the graph.", L + pw / 2, T + ph / 2);
      return;
    }

    var stride = Math.max(1, Math.floor(n / 2000));

    function line(color, transform) {
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.beginPath();
      var started = false;
      for (var i = 1; i <= n; i += stride) {
        var x = X(i), y = Y(transform(series[i - 1]));
        if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
      }
      ctx.lineTo(X(n), Y(transform(series[n - 1])));
      ctx.stroke();
    }

    line(RED, function (v) { return 1 - v; });
    line(BLUE, function (v) { return v; });

    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.arc(X(n), Y(series[n - 1]), 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.arc(X(n), Y(1 - series[n - 1]), 3.5, 0, Math.PI * 2); ctx.fill();
  }

  // ---- wiring -------------------------------------------------------------

  $("d1").addEventListener("click", function () { doDraws(1, "cards"); });
  $("d5").addEventListener("click", function () { doDraws(5, "cards"); });
  $("d100").addEventListener("click", function () { doDraws(100, "dots"); });

  $("reset").addEventListener("click", function () {
    nBlue = 0; nRed = 0; series = [];
    clearCards("No cards drawn yet.");
    render();
  });

  $("newdeck").addEventListener("click", function () {
    do { deckBlue = 15 + Math.floor(Math.random() * 71); } while (deckBlue > 47 && deckBlue < 53);
    revealed = false;
    nBlue = 0; nRed = 0; series = [];
    clearCards("New deck. No cards drawn yet.");
    render();
  });

  $("reveal").addEventListener("click", function () { revealed = !revealed; render(); });
  window.addEventListener("resize", paint);

  render();
})();
</script>
</body>
</html>
